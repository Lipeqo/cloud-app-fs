name: Backend CI-CD

on:
  push:
    branches:
      - master
    paths:
      - "backend/**"
      - ".github/workflows/backend-appservice.yml"
  workflow_dispatch:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore backend dependencies
        run: dotnet restore backend/backend.sln

      - name: Build backend
        run: dotnet build backend/backend.sln --configuration Release --no-restore

#      - name: Run unit tests
#        run: dotnet test backend/Tests/CloudBackend.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish backend
        run: dotnet publish backend/CloudBackend.csproj --configuration Release --no-build --output backend/publish

      - name: Deploy backend to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: cloud-app-backend
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: backend/publish